[package]
name = "xc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xc-core.workspace = true
xc-io.workspace = true
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
